# Dependabot opens a pull request when something this repository uses has a new version. Once a month, one PR
# per area, and no major versions (those are updated on purpose). Each PR runs the checks before it can be merged.
version: 2
updates:
  # The Home Assistant test harness – it pins the Home Assistant version the tests run against
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      tests: { patterns: ["*"] }

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(ci)" }
    groups:
      actions: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
